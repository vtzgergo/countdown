<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-shadow: 0px 2px 10px rgba(255, 255, 255, 1);
    }
    .timer {
      display: flex;
      gap: 16px;
      font-size: 36px;
    }
    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #523284; /* Óra, perc, mp színe */
    }
    .unit.days {
      color: #c43b9d; /* Napok színe */
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
      font-weight: 500;
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <div class="timer" id="timer"></div>
  <script>
    // Állítsd be a céldátumot (ÉÉÉÉ-HH-NNTHH:MM:SS format)
    const targetDate = new Date("2026-11-19T00:00:00").getTime();
    // Told mar fel
    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("timer").innerHTML = `
          <div class="unit days"><span>0</span><div class="label">nap</div></div>
          <div class="unit"><span>00</span><div class="label">óra</div></div>
          <div class="unit"><span>00</span><div class="label">perc</div></div>
          <div class="unit"><span>00</span><div class="label">mp</div></div>
        `;
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML = `
        <div class="unit days"><span>${d}</span><div class="label">nap</div></div>
        <div class="unit"><span>${String(h).padStart(2, '0')}</span><div class="label">óra</div></div>
        <div class="unit"><span>${String(m).padStart(2, '0')}</span><div class="label">perc</div></div>
        <div class="unit"><span>${String(s).padStart(2, '0')}</span><div class="label">mp</div></div>
      `;
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
