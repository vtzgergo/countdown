<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: #ffffff;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-shadow: 0px 2px 10px rgba(0, 0, 0, 0.85);
    }
    .timer {
      display: flex;
      gap: 16px;
      font-size: 36px;
    }
    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
      font-weight: 500;
      margin-top: -2px;
    }
  </style>
</head>
<body>
  <div class="timer" id="timer"></div>
  <script>
    // Állítsd be a céldátumot (ÉÉÉÉ-HH-NNTHH:MM:SS format)
    const targetDate = new Date("2026-11-19T00:00:00").getTime();

    function updateTimer() {
      const now = new Date().getTime();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById("timer").innerHTML = "0d 00h 00m 00s";
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById("timer").innerHTML = `
        <div class="unit"><span>${d}d</span><div class="label">nap</div></div>
        <div class="unit"><span>${String(h).padStart(2, '0')}h</span><div class="label">óra</div></div>
        <div class="unit"><span>${String(m).padStart(2, '0')}m</span><div class="label">perc</div></div>
        <div class="unit"><span>${String(s).padStart(2, '0')}s</span><div class="label">mp</div></div>
      `;
    }
    setInterval(updateTimer, 1000);
    updateTimer();
  </script>
</body>
</html>
