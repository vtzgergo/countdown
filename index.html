<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA VI Countdown</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Montserrat, sans-serif;
    background: transparent;
    color: white;
}

.container {
    width: 95%;
    max-width: 800px;
    text-align: center;
}

/* GTA VI LOGO */

.logo {
    font-size: clamp(90px, 16vw, 155px);
    font-weight: 900;
    letter-spacing: -12px;
    line-height: 1;
    margin-bottom: 45px;
}

.gta {
    color: #ffffff;
}

.vi {
    background: linear-gradient(135deg, #ffc5e3, #f16eae, #a66cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

/* COUNTDOWN */

.countdown {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.unit {
    padding: 20px 5px;
    border-bottom: 2px solid rgba(255,112,183,.65);
}

.number {
    font-size: clamp(32px, 7vw, 65px);
    font-weight: 900;
    letter-spacing: -3px;
    font-variant-numeric: tabular-nums;
    color: white;
}

.label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 3px;
    color: #d6b4ce;
    margin-top: 10px;
}

@media(max-width: 500px) {
    .logo {
        letter-spacing: -7px;
        margin-bottom: 35px;
    }

    .countdown {
        gap: 5px;
    }

    .unit {
        padding: 15px 2px;
    }

    .number {
        font-size: clamp(27px, 7vw, 38px);
        letter-spacing: -1px;
    }

    .label {
        font-size: 7px;
        letter-spacing: 1px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span class="gta">GTA</span><span class="vi"> VI</span>
    </div>

    <div class="countdown" id="countdown">

        <div class="unit">
            <div class="number" id="days">00</div>
            <div class="label">DAYS</div>
        </div>

        <div class="unit">
            <div class="number" id="hours">00</div>
            <div class="label">HOURS</div>
        </div>

        <div class="unit">
            <div class="number" id="minutes">00</div>
            <div class="label">MINUTES</div>
        </div>

        <div class="unit">
            <div class="number" id="seconds">00</div>
            <div class="label">SECONDS</div>
        </div>

    </div>

</div>

<script>
const target = new Date("2026-11-18T22:00:00Z").getTime();

function update() {
    const diff = target - Date.now();

    if (diff <= 0) {
        document.getElementById("countdown").innerHTML =
            "<div style='grid-column:1/-1;font-size:35px;font-weight:900'>GTA VI IS HERE!</div>";
        return;
    }

    const values = {
        days: Math.floor(diff / 86400000),
        hours: Math.floor(diff / 3600000) % 24,
        minutes: Math.floor(diff / 60000) % 60,
        seconds: Math.floor(diff / 1000) % 60
    };

    for (const key in values) {
        document.getElementById(key).textContent =
            String(values[key]).padStart(2, "0");
    }
}

update();
setInterval(update, 1000);
</script>

</body>
</html>
